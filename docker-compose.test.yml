services:
  socks-server:
    image: socks-server-socks-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5353:5353"
    environment:
      SOCKS_USERNAME: testuser
      SOCKS_PASSWORD: testpassword
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5353' 2>/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Same image started with --no-auth (and, as that mode requires, no credentials set) to
  # exercise the opt-out against the real artifact.
  socks-server-noauth:
    image: socks-server-socks-server:latest
    pull_policy: never
    command: ["--no-auth"]
    depends_on:
      - socks-server # built by that service
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5353' 2>/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  integration-tests:
    build:
      context: ./integration-tests
      dockerfile: Dockerfile
    environment:
      SOCKS_USERNAME: testuser
      SOCKS_PASSWORD: testpassword
    depends_on:
      socks-server:
        condition: service_healthy
      socks-server-noauth:
        condition: service_healthy
